name: Deploy Collector

on:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/deploy-collector.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-collector
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub-hosted runner は家庭内LAN(192.168.x.x)へ直接到達できないため、
      # Tailscale でランナー自身をtailnetに参加させてVMへ到達させる。
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Load VM SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Trust VM host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync collector/ to VM
        run: |
          rsync -az --delete \
            --exclude ".env" \
            --exclude "data/" \
            --exclude "__pycache__/" \
            --exclude ".venv/" \
            --exclude "*.sqlite" \
            --exclude "*.sqlite3" \
            ./collector/ \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/apps/sns-follower-tracker/collector/"

      - name: Rebuild collector image on VM
        run: |
          ssh "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "cd /home/${{ secrets.VM_USER }}/apps/sns-follower-tracker/collector && docker compose build"
